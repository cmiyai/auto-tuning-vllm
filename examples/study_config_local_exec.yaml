# Qwen3-30B-A3B on single A100 80GB — high-throughput optimization
study:
  name: "qwen3_30b_a100_throughput"

optimization:
  preset: "high_throughput"
  sampler: "botorch"
  n_trials: 200
  max_concurrent: 1

benchmark:
  benchmark_type: "guidellm"
  model: "RedHatAI/Qwen3-30B-A3B-FP8-dynamic"
  max_seconds: 300
  dataset: null
  prompt_tokens: 2000
  output_tokens: 1000
  rate: 10

logging:
  file_path: "/tmp/auto-tune-vllm-local-run/logs"
  log_level: "INFO"

parameters:
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 8192
    step: 512

  gpu_memory_utilization:
    enabled: true
    min: 0.90
    max: 0.95
    step: 0.01

  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]

  block_size:
    enabled: true
    options: [8, 16, 32]

  long_prefill_token_threshold:
    enabled: true
    options: [0, 256, 512, 1024, 2048, 4096]

  max_num_partial_prefills:
    enabled: true
    options: [1, 2, 4]

  max_seq_len_to_capture:
    enabled: true
    min: 4096
    max: 8192
    step: 1024

  VLLM_ATTENTION_BACKEND:
    enabled: true
    type: environment
    options: ["FLASH_ATTN", "FLASHINFER"]

static_environment_variables:
  VLLM_USE_V1: "1"
  VLLM_STARTUP_TIMEOUT: "900"
